<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>กรุ๊งกริ๊ง ทอดกรอบ — อาหารสด แปรรูป</title>
    <meta name="description" content="ปอเปี๊ยะทอดกรอบ ไก่ทอดกรอบ กุ้งทอดกรอบ สดใหม่ทุกวัน สั่งซื้อง่ายผ่าน Line และ Facebook" />
    <meta name="author" content="กรุ๊งกริ๊ง ทอดกรอบ" />

    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//supabase.co" />
    <link rel="dns-prefetch" href="//neon.tech" />
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    <!-- Open Graph tags -->
    <meta property="og:title" content="กรุ๊งกริ๊ง ทอดกรอบ — อาหารสด แปรรูป" />
    <meta property="og:description" content="กรุ๊งกริ๊ง ทอดกรอบ — อาหารสด แปรรูป สดใหม่ทุกวัน สั่งซื้อง่ายผ่าน Line และ Facebook" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sunny-style-shop.vercel.app" />
    <meta property="og:image" content="https://sunny-style-shop.vercel.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kenginol" />
    <meta name="twitter:image" content="https://sunny-style-shop.vercel.app/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
